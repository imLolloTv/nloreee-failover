# wrangler.toml
name = 'nloreee-failover'
main = "worker.js"
compatibility_date = "2026-09-27"
keep_vars = true

[assets]
# Output statico del progetto Next.js in fallback-app/ (next build con output: "export")
directory = "./fallback-app/out"
binding = "ASSETS"
# Fondamentale: ogni richiesta deve passare prima dal Worker (per la logica di
# proxy/failover). Senza questo, Cloudflare servirebbe gli asset direttamente
# per i path che coincidono, bypassando il Worker.
run_worker_first = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
